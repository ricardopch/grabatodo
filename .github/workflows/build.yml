name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: grabatodo-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk grabatodo.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest grabatodo.apk --title "Grabatodo (última versión)" --notes "APK debug firmado con la clave de depuración. Descárgalo e instálalo en el móvil."
